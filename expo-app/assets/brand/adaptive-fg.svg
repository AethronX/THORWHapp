    <path d="M262 760 H762" stroke="#FBF5E9" stroke-width="52" stroke-linecap="round"/>
    <!-- three rising bars: saving that grows -->
    <rect x="388" y="604" width="64" height="104" rx="18" fill="url(#gold)"/>
    <rect x="480" y="530" width="64" height="178" rx="18" fill="url(#gold)"/>
    <rect x="572" y="452" width="64" height="256" rx="18" fill="url(#gold)"/>
  </g>
</svg>
